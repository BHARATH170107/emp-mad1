{% extends "base.html" %}
{% block title %}Rubric{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm"><div class="card-body">
  <h3 class="mb-1">{{ 'Edit' if rubric else 'Add' }} Rubric Criterion</h3>
  <p class="text-muted">{{ exam.name }} (max {{ exam.max_marks }} marks)</p>
  <form method="post">
    <div class="mb-3"><label class="form-label">Criterion name</label>
      <input name="criterion_name" class="form-control" value="{{ f.get('criterion_name', '') }}" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Maximum marks</label>
        <input type="number" min="1" name="max_marks" class="form-control" value="{{ f.get('max_marks', '') }}" required></div>
      <div class="col-md-6 mb-3"><label class="form-label">Weightage</label>
        <input type="number" step="any" min="0" name="weightage" class="form-control" value="{{ f.get('weightage', 1) }}"></div>
    </div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ f.get('description', '') }}</textarea></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('admin.exam_detail', exam_id=exam.id) }}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
