{% extends "base.html" %}
{% block title %}Course{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm"><div class="card-body">
  <h3 class="mb-3">{{ 'Edit' if course else 'Add' }} Course</h3>
  <form method="post">
    <div class="mb-3"><label class="form-label">Course code</label>
      <input name="code" class="form-control" value="{{ f.get('code', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Course name</label>
      <input name="name" class="form-control" value="{{ f.get('name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ f.get('description', '') }}</textarea></div>
    <div class="mb-3"><label class="form-label">Status</label>
      <select name="status" class="form-select">
        {% for s in ['Active', 'Inactive'] %}
        <option {{ 'selected' if f.get('status', 'Active') == s }}>{{ s }}</option>
        {% endfor %}
      </select></div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('admin.courses') }}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
