{% extends "base.html" %}
{% block title %}Add Examiner{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm"><div class="card-body">
  <h3 class="mb-3">Add Examiner</h3>
  <form method="post">
    <div class="mb-3"><label class="form-label">Full name</label>
      <input name="full_name" class="form-control" value="{{ f.get('full_name', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Username</label>
      <input name="username" class="form-control" value="{{ f.get('username', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" value="{{ f.get('email', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Phone</label>
      <input name="phone" class="form-control" value="{{ f.get('phone', '') }}"></div>
    <div class="mb-3"><label class="form-label">Department</label>
      <input name="department" class="form-control" value="{{ f.get('department', '') }}" required></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input type="password" name="password" minlength="6" class="form-control" required></div>
    <button class="btn btn-primary">Add (auto-approved)</button>
    <a class="btn btn-secondary" href="{{ url_for('admin.examiners') }}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
