{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Register</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Register as</label><br>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" value="student" id="r1"
                     {% if form.get('role', 'student') == 'student' %}checked{% endif %}>
              <label class="form-check-label" for="r1">Student</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="role" value="examiner" id="r2"
                     {% if form.get('role') == 'examiner' %}checked{% endif %}>
              <label class="form-check-label" for="r2">Examiner</label>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" name="full_name" class="form-control" value="{{ form.get('full_name', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ form.get('username', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ form.get('email', '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ form.get('phone', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Department <small class="text-muted">(examiners only)</small></label>
            <input type="text" name="department" class="form-control" value="{{ form.get('department', '') }}">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" minlength="6" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Confirm password</label>
              <input type="password" name="confirm" class="form-control" minlength="6" required>
            </div>
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
